server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: retail-inventory-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retail_inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
