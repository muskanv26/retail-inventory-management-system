server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import: optional:application-local.properties
  application:
    name: retail-inventory-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retail_inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

